<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preschool Flashcards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-view {
             display: block;
        }
        
        .search-container {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .search-container input {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid transparent;
            font-size: 1.2em;
        }

        .search-container button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background: #51cf66;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .category-btn {
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            color: white;
        }
        
        .category-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        
        .flashcard-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            display: none;
        }
        
        .flashcard-container.active {
            display: block;
        }
        
        .flashcard-image {
            width: 100%;
            max-width: 400px;
            height: 400px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 200px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 3px solid #ddd;
            overflow: hidden;
        }

        .flashcard-image img {
             width: 100%;
             height: 100%;
             object-fit: cover;
        }
        
        .flashcard-name {
            font-size: 3em;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        
        .control-btn {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            color: white;
        }
        
        .btn-prev { background: #ff6b6b; }
        .btn-next { background: #51cf66; }
        .btn-speak { background: #4dabf7; }
        .btn-back { background: #868e96; }
        
        .control-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .counter {
            font-size: 1.5em;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌈 Preschool Flashcards 🌈</h1>
        
        <div class="main-view" id="mainView">
            <div class="search-container">
                 <input type="text" id="search-input" placeholder="Search any word...">
                 <button onclick="searchPicture()">Search</button>
            </div>
            <div class="categories" id="categories">

                <button class="category-btn" style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);" onclick="showCategory('polygons')">💠 Polygons</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%);" onclick="showCategory('careers')">🧑‍🏫 Careers</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);" onclick="showCategory('transport')">🚗 Transport</button>

                <button class="category-btn" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);" onclick="showCategory('seasons')">🍂 Seasons</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);" onclick="showCategory('weather')">☀️ Weather</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);" onclick="showCategory('restaurant')">🍔 Restaurant</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);" onclick="showCategory('kitchen')">🍳 Kitchen</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);" onclick="showCategory('vegetables')">🥦 Vegetables</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);" onclick="showCategory('fruits')">🍓 Fruits</button>
            </div>
        </div>
        
        <div class="flashcard-container" id="flashcardContainer">
            <div class="flashcard">
                <div class="flashcard-image" id="flashcardImage"></div>
                <div class="flashcard-name" id="flashcardName"></div>
                <div class="counter" id="counter"></div>
            </div>
            
            <div class="controls">
                <button class="control-btn btn-back" onclick="backToCategories()">🏠 Back</button>
                <button id="prevBtn" class="control-btn btn-prev" onclick="prevCard()">⬅️ Previous</button>
                <button class="control-btn btn-speak" onclick="speakCurrentWord()">🔊 Say It!</button>
                <button id="nextBtn" class="control-btn btn-next" onclick="nextCard()">Next ➡️</button>
            </div>
        </div>
    </div>

            fruits: [ {name: 'Apple', emoji: '🍎'}, {name: 'Banana', emoji: '🍌'}, {name: 'Orange', emoji: '🍊'}, {name: 'Grapes', emoji: '🍇'}, {name: 'Strawberry', emoji: '🍓'}, {name: 'Watermelon', emoji: '🍉'}, {name: 'Pineapple', emoji: '🍍'}, {name: 'Mango', emoji: '🥭'}, {name: 'Peach', emoji: '🍑'}, {name: 'Pear', emoji: '🍐'}, {name: 'Cherry', emoji: '🍒'}, {name: 'Kiwi', emoji: '🥝'}, {name: 'Lemon', emoji: '🍋'}, {name: 'Coconut', emoji: '🥥'}, {name: 'Avocado', emoji: '🥑'}, {name: 'Blueberry', emoji: '🫐'}, {name: 'Melon', emoji: '🍈'}, {name: 'Papaya', emoji: '🍈'}, {name: 'Plum', emoji: '🍑'}, {name: 'Raspberry', emoji: '🍓'} ]
        };

        let currentCategory = '';
        let currentIndex = 0;
        let currentWord = '';

        const PEXELS_API_KEY = "ILRTk4vCDhwNFMRUWz9or1QAl9uEdRnF8CxWWnheDE2BLRWNGlwn78sW";

        const mainView = document.getElementById('mainView');
        const flashcardContainer = document.getElementById('flashcardContainer');
        const flashcardImage = document.getElementById('flashcardImage');
        const flashcardName = document.getElementById('flashcardName');
        const counter = document.getElementById('counter');
        const searchInput = document.getElementById('search-input');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        async function searchPicture() {
            const searchTerm = searchInput.value.trim();
            if (!searchTerm) return;

            mainView.style.display = 'none';
            flashcardContainer.classList.add('active');
            
            flashcardImage.innerHTML = 'Loading...';
            flashcardName.textContent = 'Searching...';
            currentWord = searchTerm;
            counter.textContent = "Search Result";
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            
            const url = `https://api.pexels.com/v1/search?query=${searchTerm}&per_page=1`;
            try {
                const response = await fetch(url, { headers: { Authorization: PEXELS_API_KEY } });
                const data = await response.json();
                if (data.photos && data.photos.length > 0) {
                    const imageUrl = data.photos[0].src.large;
                    flashcardImage.innerHTML = `<img src="${imageUrl}" alt="${searchTerm}">`;
                    const capitalizedWord = searchTerm.charAt(0).toUpperCase() + searchTerm.slice(1);
                    flashcardName.textContent = capitalizedWord;
                    currentWord = capitalizedWord;
                    speakCurrentWord();
                } else {
                    flashcardImage.textContent = '😢';
                    flashcardName.textContent = 'Not Found';
                    currentWord = 'Not Found';
                }
            } catch (error) {
                flashcardImage.textContent = '❌';
                flashcardName.textContent = 'Error';
                currentWord = 'Error';
                console.error("Pexels API Error:", error);
            }
        }
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchPicture();
        });

        function showCategory(category) {
            currentCategory = category;
            currentIndex = 0;
            mainView.style.display = 'none';
            flashcardContainer.classList.add('active');
            prevBtn.style.display = 'block';
            nextBtn.style.display = 'block';
            showCard();
        }

        function showCard() {
            const card = flashcards[currentCategory][currentIndex];
            flashcardImage.innerHTML = card.emoji;
            flashcardName.textContent = card.name;
            currentWord = card.name;
            counter.textContent = `${currentIndex + 1} of ${flashcards[currentCategory].length}`;
            speakCurrentWord();
        }

        function nextCard() {
            const cards = flashcards[currentCategory];
            currentIndex = (currentIndex + 1) % cards.length;
            showCard();
        }

        function prevCard() {
            const cards = flashcards[currentCategory];
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            showCard();
        }

        function speakCurrentWord() {
            if ('speechSynthesis' in window && currentWord) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(currentWord);
                utterance.rate = 0.8;
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        function backToCategories() {
            mainView.style.display = 'block';
            flashcardContainer.classList.remove('active');
            window.speechSynthesis.cancel();
        }
        
        document.addEventListener('keydown', (e) => {
            if (flashcardContainer.classList.contains('active')) {
                if (e.key === 'ArrowRight' && nextBtn.style.display !== 'none') nextCard();
                if (e.key === 'ArrowLeft' && prevBtn.style.display !== 'none') prevCard();
                if (e.key === ' ') {
                    e.preventDefault();
                    speakCurrentWord();
                }
                if (e.key === 'Escape') backToCategories();
            }
        });
    </script>
