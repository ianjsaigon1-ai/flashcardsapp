<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preschool Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 300px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.3);
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .category-btn, .control-btn {
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            color: white;
            border: none;
        }
        .category-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        .category-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .flashcard-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .flashcard-image {
            width: 100%;
            height: 350px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 180px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 3px solid #ddd;
            overflow: hidden;
        }
        .flashcard-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .flashcard-name {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .control-btn {
            padding: 15px 25px;
            font-size: 1.1em;
        }
        .btn-prev { background: #ff6b6b; }
        .btn-next { background: #51cf66; }
        .btn-speak { background: #4dabf7; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2 class="text-white text-2xl font-bold text-center mb-4">Categories</h2>
            
            <div class="mb-6">
                <input type="text" id="search-input" class="w-full p-3 rounded-lg border-2 border-transparent focus:border-blue-400 focus:outline-none" placeholder="Search for any picture...">
                <button onclick="searchPicture()" class="w-full mt-2 p-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg transition">Search</button>
            </div>

            <div id="categories">
                <button class="category-btn" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);" onclick="showCategory('wild')">🦁 Wild Animals</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);" onclick="showCategory('pets')">🐕 Pets</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);" onclick="showCategory('fruits')">🍎 Fruits</button>
                 <button class="category-btn" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);" onclick="showCategory('vegetables')">🥕 Vegetables</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);" onclick="showCategory('transport')">🚗 Transport</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);" onclick="showCategory('colors')">🎨 Colors</button>
                <button class="category-btn" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);" onclick="showCategory('numbers')">🔢 Numbers</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="flashcard-container">
                <div class="flashcard-image" id="flashcard-image-container">
                    <!-- Content (emoji or image) will be set here -->
                </div>
                <div class="flashcard-name" id="flashcard-name">Select a category or search!</div>
                <div class="counter" id="counter" style="font-size: 1.2em; color: #666; margin-top: 15px;"></div>
                
                <div class="controls mt-4">
                    <button id="prev-btn" class="control-btn btn-prev" onclick="prevCard()">⬅️ Previous</button>
                    <button class="control-btn btn-speak" onclick="speakCard()">🔊 Say It!</button>
                    <button id="next-btn" class="control-btn btn-next" onclick="nextCard()">Next ➡️</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const flashcards = {
            wild: [ {name: 'Lion', emoji: '🦁'}, {name: 'Tiger', emoji: '🐯'}, {name: 'Elephant', emoji: '🐘'}, {name: 'Giraffe', emoji: '🦒'}, {name: 'Zebra', emoji: '🦓'}, {name: 'Monkey', emoji: '🐒'} ],
            pets: [ {name: 'Dog', emoji: '🐕'}, {name: 'Cat', emoji: '🐈'}, {name: 'Rabbit', emoji: '🐇'}, {name: 'Hamster', emoji: '🐹'}, {name: 'Fish', emoji: '🐠'}, {name: 'Bird', emoji: '🐦'} ],
            fruits: [ {name: 'Apple', emoji: '🍎'}, {name: 'Banana', emoji: '🍌'}, {name: 'Orange', emoji: '🍊'}, {name: 'Grapes', emoji: '🍇'}, {name: 'Strawberry', emoji: '🍓'}, {name: 'Watermelon', emoji: '🍉'} ],
            vegetables: [ {name: 'Carrot', emoji: '🥕'}, {name: 'Broccoli', emoji: '🥦'}, {name: 'Tomato', emoji: '🍅'}, {name: 'Corn', emoji: '🌽'}, {name: 'Cucumber', emoji: '🥒'}, {name: 'Lettuce', emoji: '🥬'} ],
            transport: [ {name: 'Car', emoji: '🚗'}, {name: 'Bus', emoji: '🚌'}, {name: 'Train', emoji: '🚂'}, {name: 'Airplane', emoji: '✈️'}, {name: 'Helicopter', emoji: '🚁'}, {name: 'Boat', emoji: '⛵'} ],
            colors: [ {name: 'Red', emoji: '🔴'}, {name: 'Blue', emoji: '🔵'}, {name: 'Yellow', emoji: '🟡'}, {name: 'Green', emoji: '🟢'}, {name: 'Orange', emoji: '🟠'}, {name: 'Purple', emoji: '🟣'} ],
            numbers: Array.from({length: 10}, (_, i) => ({name: `${i + 1}`, emoji: `${i + 1}`}))
        };

        let currentCategory = '';
        let currentIndex = 0;
        let currentWord = 'Welcome!';

        const imageContainer = document.getElementById('flashcard-image-container');
        const nameContainer = document.getElementById('flashcard-name');
        const counterContainer = document.getElementById('counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const searchInput = document.getElementById('search-input');

        // --- NEW: PEXELS API FUNCTIONALITY ---
        const PEXELS_API_KEY = "ILRTk4vCDhwNFMRUWz9or1QAl9uEdRnF8CxWWnheDE2BLRWNGlwn78sW";

        async function searchPicture() {
            const searchTerm = searchInput.value.trim();
            if (!searchTerm) {
                alert("Please enter a word to search for.");
                return;
            }
            
            // Show a loading state
            imageContainer.innerHTML = `<span style="font-size: 1rem;">Loading...</span>`;
            nameContainer.textContent = "Searching...";
            
            const url = `https://api.pexels.com/v1/search?query=${searchTerm}&per_page=1`;
            
            try {
                const response = await fetch(url, {
                    headers: {
                        Authorization: PEXELS_API_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error(`Pexels API error: ${response.status}`);
                }

                const data = await response.json();

                if (data.photos && data.photos.length > 0) {
                    const imageUrl = data.photos[0].src.large; // Use the 'large' version of the photo
                    imageContainer.innerHTML = `<img src="${imageUrl}" alt="${searchTerm}" class="w-full h-full object-cover">`;
                    const capitalizedWord = searchTerm.charAt(0).toUpperCase() + searchTerm.slice(1);
                    nameContainer.textContent = capitalizedWord;
                    currentWord = capitalizedWord;
                    speakCard();
                } else {
                    imageContainer.innerHTML = `<span style="font-size: 1rem; text-align: center;">No image found for "${searchTerm}"</span>`;
                    nameContainer.textContent = "Not Found";
                    currentWord = "Not Found";
                }

            } catch (error) {
                console.error("Failed to fetch image from Pexels:", error);
                imageContainer.innerHTML = `<span style="font-size: 1rem; text-align: center;">Sorry, the search failed. Please try again.</span>`;
                nameContainer.textContent = "Error";
                currentWord = "Error";
            }
            
            counterContainer.textContent = "Search Result";
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
        }

        searchInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchPicture();
            }
        });
        // --- END OF NEW PEXELS CODE ---

        function showCategory(category) {
            currentCategory = category;
            currentIndex = 0;
            prevBtn.style.display = 'block';
            nextBtn.style.display = 'block';
            updateCard();
        }

        function updateCard() {
            const cards = flashcards[currentCategory];
            const card = cards[currentIndex];
            imageContainer.innerHTML = `<span style="font-size: 180px;">${card.emoji}</span>`;
            nameContainer.textContent = card.name;
            currentWord = card.name;
            counterContainer.textContent = `${currentIndex + 1} of ${cards.length}`;
            speakCard(false);
        }

        function nextCard() {
            const cards = flashcards[currentCategory];
            if (!cards) return;
            currentIndex = (currentIndex + 1) % cards.length;
            updateCard();
        }

        function prevCard() {
            const cards = flashcards[currentCategory];
            if (!cards) return;
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            updateCard();
        }

        function speakCard(forceSpeak = true) {
            if (forceSpeak && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(currentWord);
                utterance.rate = 0.8;
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
