<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preschool Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e0f7fa; /* A soft, friendly light blue */
            background-image: radial-gradient(#ffffff 1px, transparent 1px);
            background-size: 15px 15px;
        }
        .flashcard { perspective: 1000px; }
        .card-face { backface-visibility: hidden; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-back { transform: rotateY(180deg); }
        .flashcard.is-flipped .card-front { transform: rotateY(-180deg); }
        .flashcard.is-flipped .card-back { transform: rotateY(0deg); }
        .category-btn.active { background-color: #2563EB; color: white; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .speaker-icon { cursor: pointer; transition: transform 0.2s; }
        .speaker-icon:hover { transform: scale(1.1); }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden">

    <div class="flex h-full">
        <!-- Left Column: Categories -->
        <aside class="w-1/4 bg-white/80 backdrop-blur-sm p-4 overflow-y-auto shadow-lg">
            <h2 class="text-2xl font-bold text-gray-700 mb-4 text-center">Categories</h2>
            <div id="category-buttons" class="space-y-2">
                <!-- Buttons Generated Here -->
            </div>
        </aside>

        <!-- Right Column: Flashcard -->
        <main class="flex-1 flex flex-col items-center justify-center p-6">
            <div class="w-full max-w-xl">
                <div id="flashcard" class="flashcard w-full h-96 rounded-2xl shadow-2xl cursor-pointer mb-6" onclick="flipCard()">
                    <div class="relative w-full h-full">
                        <div class="card-face card-front absolute w-full h-full bg-white rounded-2xl flex items-center justify-center overflow-hidden">
                            <img id="card-image" src="" alt="Flashcard Image" class="w-full h-full object-contain p-5">
                        </div>
                        <div class="card-face card-back absolute w-full h-full bg-blue-500 text-white rounded-2xl flex flex-col items-center justify-center">
                            <h2 id="card-word" class="text-7xl font-bold"></h2>
                            <i class="fas fa-volume-up speaker-icon text-4xl mt-4" onclick="event.stopPropagation(); speakWord();"></i>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center">
                    <button onclick="prevCard()" class="bg-white hover:bg-gray-100 text-gray-800 font-bold py-4 px-8 rounded-full transition shadow-lg">&larr; Previous</button>
                    <button onclick="nextCard()" class="bg-white hover:bg-gray-100 text-gray-800 font-bold py-4 px-8 rounded-full transition shadow-lg">Next &rarr;</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- The Flashcard Library ---
        // New, permanent, and reliable image links from Imgur.
        const decks = {
            "Wild Animals": [
                { image: "https://i.imgur.com/3hXAmP2.png", word: "Lion" }, { image: "https://i.imgur.com/s0m5Iqg.png", word: "Tiger" },
                { image: "https://i.imgur.com/CN23a5n.png", word: "Elephant" }, { image: "https://i.imgur.com/NqA1k0n.png", word: "Giraffe" },
                { image: "https://i.imgur.com/GzL62pG.png", word: "Monkey" }, { image: "https://i.imgur.com/rS2n5qa.png", word: "Zebra" },
                { image: "https://i.imgur.com/1Gv2x72.png", word: "Bear" }, { image: "https://i.imgur.com/FBlGfmc.png", word: "Hippo" },
                { image: "https://i.imgur.com/jI9n1Y5.png", word: "Kangaroo" }, { image: "https://i.imgur.com/2Y5X5Xq.png", word: "Panda" }
            ],
            "Pets": [
                { image: "https://i.imgur.com/v1h3j3a.png", word: "Dog" }, { image: "https://i.imgur.com/t4s7k9P.png", word: "Cat" },
                { image: "https://i.imgur.com/t2eL0z5.png", word: "Fish" }, { image: "https://i.imgur.com/8Q5F5t1.png", word: "Bird" },
                { image: "https://i.imgur.com/M5b1tV9.png", word: "Hamster" }, { image: "https://i.imgur.com/xO43t1f.png", word: "Rabbit" },
                { image: "https://i.imgur.com/7j4Z6y1.png", word: "Turtle" }
            ],
            "Fruits & Veggies": [
                { image: "https://i.imgur.com/o2v8M6R.png", word: "Apple" }, { image: "https://i.imgur.com/tL8YQ3d.png", word: "Banana" },
                { image: "https://i.imgur.com/yTqB1M0.png", word: "Strawberry" }, { image: "https://i.imgur.com/J3x2jY6.png", word: "Orange" },
                { image: "https://i.imgur.com/5l3n6xH.png", word: "Grapes" }, { image: "https://i.imgur.com/2z8b2M6.png", word: "Carrot" },
                { image: "https://i.imgur.com/8z6O8d3.png", word: "Broccoli" }, { image: "https://i.imgur.com/9j6n3kG.png", word: "Tomato" }
            ],

                { image: "https://i.imgur.com/A9n3l8b.png", word: "Triangle" }, { image: "https://i.imgur.com/vH3s9mK.png", word: "Star" },
                { image: "https://i.imgur.com/tW4p2z1.png", word: "Heart" }, { image: "https://i.imgur.com/O1f4a4p.png", word: "Rectangle" },
                { image: "https://i.imgur.com/yF5R8dG.png", word: "Oval" }, { image: "https://i.imgur.com/xQ6E8z9.png", word: "Diamond" }
            ],

                { image: "https://i.imgur.com/8S1g5gB.png", word: "Orange" }, { image: "https://i.imgur.com/xQ7z9tB.png", word: "Purple" },
                { image: "https://i.imgur.com/g8O5n7E.png", word: "Pink" }, { image: "https://i.imgur.com/c4t3k1F.png", word: "Black" }
            ],

                { image: "https://i.imgur.com/j1z5t7V.png", word: "Boat" }, { image: "https://i.imgur.com/3Y4W8z1.png", word: "Bicycle" },
                { image: "https://i.imgur.com/t4R6y8b.png", word: "Helicopter" }
            ],
            "Careers": [
                { image: "https://i.imgur.com/e2Y3m6d.png", word: "Doctor" }, { image: "https://i.imgur.com/r7w8O4f.png", word: "Firefighter" },
                { image: "https://i.imgur.com/A6j4n5f.png", word: "Police Officer" }, { image: "https://i.imgur.com/L6d5f7S.png", word: "Teacher" },
                { image: "https://i.imgur.com/k9v4e7Z.png", word: "Astronaut" }, { image: "https://i.imgur.com/t3R6g8X.png", word: "Chef" },
                { image: "https://i.imgur.com/yQ9t8eO.png", word: "Farmer" }
            ],
            "Human Body": [
                { image: "https://i.imgur.com/2Q4E7p5.png", word: "Eyes" }, { image: "https://i.imgur.com/w2Y3n6f.png", word: "Nose" },
                { image: "https://i.imgur.com/r8t7O5e.png", word: "Mouth" }, { image: "https://i.imgur.com/A7j5n6g.png", word: "Ears" },
                { image: "https://i.imgur.com/L7d6f8T.png", word: "Hands" }, { image: "https://i.imgur.com/k0v5e8Z.png", word: "Feet" },
                { image: "https://i.imgur.com/t4R7g9X.png", word: "Hair" }
            ],
            "Weather": [
                { image: "https://i.imgur.com/3fP5o7d.png", word: "Sunny" }, { image: "https://i.imgur.com/9gY8w4p.png", word: "Cloudy" },
                { image: "https://i.imgur.com/xR9z7h6.png", word: "Rainy" }, { image: "https://i.imgur.com/8R8p7o2.png", word: "Snowy" },
                { image: "https://i.imgur.com/j2z6t8W.png", word: "Windy" }, { image: "https://i.imgur.com/t5S7y9c.png", word: "Stormy" }
            ],
            "Kitchen": [
                { image: "https://i.imgur.com/3hV6m7e.png", word: "Spoon" }, { image: "https://i.imgur.com/9hZ9x5q.png", word: "Fork" },
                { image: "https://i.imgur.com/xT0a8i7.png", word: "Plate" }, { image: "https://i.imgur.com/8S9p8o3.png", word: "Cup" },
                { image: "https://i.imgur.com/j3z7u9X.png", word: "Knife" }, { image: "https://i.imgur.com/t6T8z0d.png", word: "Bowl" }
            ],
             "Space": [
                { image: "https://i.imgur.com/3fQ4o6c.png", word: "Sun" }, { image: "https://i.imgur.com/9gV7x3p.png", word: "Moon" },
                { image: "https://i.imgur.com/xR8y6h5.png", word: "Earth" }, { image: "https://i.imgur.com/8Q7p6o1.png", word: "Star" },
                { image: "https://i.imgur.com/j1z5t7V.png", word: "Rocket" }, { image: "https://i.imgur.com/t4R6y8b.png", word: "Alien" }
            ]
        };

        let currentCategory = Object.keys(decks)[0];
        let currentCardIndex = 0;
        const synth = window.speechSynthesis;

        const flashcard = document.getElementById('flashcard');
        const cardImage = document.getElementById('card-image');
        const cardWord = document.getElementById('card-word');
        const categoryButtonsContainer = document.getElementById('category-buttons');

        function initializeApp() {
            for (const category in decks) {
                if (decks[category].length === 0) continue; // Skip empty categories
                const button = document.createElement('button');
                button.id = `btn-${category.replace(/[^a-zA-Z0-9]/g, '-')}`;
                button.textContent = category;
                button.className = 'category-btn w-full text-left bg-white hover:bg-gray-100 text-gray-800 font-semibold py-3 px-4 rounded-lg transition shadow';
                button.onclick = () => changeCategory(category);
                categoryButtonsContainer.appendChild(button);
            }
            document.querySelector('.category-btn').classList.add('active');
            showCard(currentCardIndex);
        }

        function changeCategory(newCategory) {
            currentCategory = newCategory;
            currentCardIndex = 0;
            showCard(currentCardIndex);
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${newCategory.replace(/[^a-zA-Z0-9]/g, '-')}`).classList.add('active');
        }

        function showCard(index) {
            flashcard.classList.remove('is-flipped');
            const currentDeck = decks[currentCategory];
            if (currentDeck && currentDeck[index]) {
                cardImage.src = currentDeck[index].image;
                cardWord.textContent = currentDeck[index].word;
            }
        }
        
        function speakWord() {
            if (synth.speaking) { synth.cancel(); }
            const wordToSpeak = decks[currentCategory][currentCardIndex].word;
            const utterance = new SpeechSynthesisUtterance(wordToSpeak);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            synth.speak(utterance);
        }

        function flipCard() {
            flashcard.classList.toggle('is-flipped');
            if (flashcard.classList.contains('is-flipped')) {
                setTimeout(speakWord, 300);
            }
        }

        function nextCard() {
            const currentDeck = decks[currentCategory];
            currentCardIndex = (currentCardIndex + 1) % currentDeck.length;
            showCard(currentCardIndex);
        }

        function prevCard() {
            const currentDeck = decks[currentCategory];
            currentCardIndex = (currentCardIndex - 1 + currentDeck.length) % currentDeck.length;
            showCard(currentCardIndex);
        }

        initializeApp();
    </script>
</body>
</html>
