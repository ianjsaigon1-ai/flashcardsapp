<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preschool Flashcards</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; overflow: hidden; }
        .app-container { display: flex; height: 100%; }
        .sidebar { width: 280px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(255, 255, 255, 0.2); }
        .sidebar h2 { text-align: center; color: white; font-size: 1.5em; margin-bottom: 15px; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        .search-container input { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 1em; margin-bottom: 8px; }
        .search-container button { width: 100%; padding: 10px; font-size: 1em; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; background: #51cf66; transition: all 0.2s; }
        .search-container button:hover { background: #40c057; }
        .categories { flex-grow: 1; overflow-y: auto; margin-top: 15px; padding-right: 5px; }
        .category-btn { width: 100%; padding: 12px; margin-bottom: 8px; font-size: 1em; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); color: white; text-align: left; }
        .category-btn:hover { transform: scale(1.03); }
        .main-content { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .flashcard-container { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; width: 100%; max-width: 400px; }
        .flashcard-image { width: 100%; height: 250px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 120px; background: #f8f9fa; border-radius: 15px; border: 3px solid #ddd; overflow: hidden; padding: 10px; }
        .flashcard-image img { width: 100%; height: 100%; object-fit: cover; }
        .flashcard-name { font-size: 2.2em; color: #333; margin-bottom: 20px; font-weight: bold; min-height: 40px;}
        .controls { display: flex; gap: 10px; justify-content: center; }
        .control-btn { padding: 10px 20px; font-size: 1em; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: white; }
        .btn-prev { background: #ff6b6b; }
        .btn-next { background: #51cf66; }
        .btn-speak { background: #4dabf7; }
        .counter { font-size: 1.1em; color: #666; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>Categories</h2>
            <div class="search-container">
                 <input type="text" id="search-input" placeholder="Search any word...">
                 <button onclick="searchPicture()">Search</button>
            </div>
            <div class="categories" id="categories-container">
                <!-- Buttons will be generated here -->
            </div>
        </aside>
        <main class="main-content">
            <div class="flashcard-container" id="flashcardContainer">
                <div class="flashcard-image" id="flashcardImage">Welcome!</div>
                <div class="flashcard-name" id="flashcardName">Select or search</div>
                <div class="counter" id="counter"></div>
                <div class="controls">
                    <button id="prevBtn" class="control-btn btn-prev" onclick="prevCard()">⬅️ Prev</button>
                    <button class="control-btn btn-speak" onclick="speakCurrentWord()">🔊 Say It</button>
                    <button id="nextBtn" class="control-btn btn-next" onclick="nextCard()">Next ➡️</button>
                </div>
            </div>
        </main>
    </div>
    <script>
        const decks = {
            'alphabet': [ {name: 'A'}, {name: 'B'}, {name: 'C'}, {name: 'D'}, {name: 'E'}, {name: 'F'}, {name: 'G'}, {name: 'H'}, {name: 'I'}, {name: 'J'}, {name: 'K'}, {name: 'L'}, {name: 'M'}, {name: 'N'}, {name: 'O'}, {name: 'P'}, {name: 'Q'}, {name: 'R'}, {name: 'S'}, {name: 'T'}, {name: 'U'}, {name: 'V'}, {name: 'W'}, {name: 'X'}, {name: 'Y'}, {name: 'Z'} ],

            'expressions': [ {name: 'Happy', emoji: '😄'}, {name: 'Sad', emoji: '😢'}, {name: 'Angry', emoji: '😠'}, {name: 'Surprised', emoji: '😮'}, {name: 'Laughing', emoji: '😂'}, {name: 'Crying', emoji: '😭'}, {name: 'Scared', emoji: '😨'}, {name: 'Tired', emoji: '😴'}, {name: 'Sick', emoji: '🤒'}, {name: 'Love', emoji: '😍'} ],
            'wild-animals': [ {name: 'Lion', emoji: '🦁'}, {name: 'Tiger', emoji: '🐯'}, {name: 'Elephant', emoji: '🐘'}, {name: 'Giraffe', emoji: '🦒'}, {name: 'Zebra', emoji: '🦓'}, {name: 'Monkey', emoji: '🐒'} ],
            'pets': [ {name: 'Dog', emoji: '🐕'}, {name: 'Cat', emoji: '🐈'}, {name: 'Rabbit', emoji: '🐇'}, {name: 'Hamster', emoji: '🐹'}, {name: 'Fish', emoji: '🐠'} ],
            'space': [ {name: 'Sun', emoji: '☀️'}, {name: 'Moon', emoji: '🌙'}, {name: 'Star', emoji: '⭐'}, {name: 'Earth', emoji: '🌍'}, {name: 'Rocket', emoji: '🚀'} ],
            'human-body': [ {name: 'Head', emoji: '👤'}, {name: 'Eyes', emoji: '👀'}, {name: 'Nose', emoji: '👃'}, {name: 'Mouth', emoji: '👄'}, {name: 'Hands', emoji: '✋'} ],
            'colors': [ {name: 'Red', emoji: '🔴'}, {name: 'Blue', emoji: '🔵'}, {name: 'Yellow', emoji: '🟡'}, {name: 'Green', emoji: '🟢'}, {name: 'Purple', emoji: '🟣'} ],
            'shapes': [ {name: 'Circle', emoji: '⭕'}, {name: 'Square', emoji: '🟦'}, {name: 'Triangle', emoji: '🔺'}, {name: 'Star', emoji: '⭐'}, {name: 'Heart', emoji: '❤️'} ],
            'numbers': Array.from({length: 100}, (_, i) => ({name: `${i + 1}`, emoji: `${i + 1}`})),
            'polygons': [ {name: 'Triangle', emoji: '🔺'}, {name: 'Square', emoji: '🟦'}, {name: 'Pentagon', emoji: '⬟'}, {name: 'Hexagon', emoji: '⬡'} ],
            'careers': [ {name: 'Doctor', emoji: '👨‍⚕️'}, {name: 'Teacher', emoji: '👨‍🏫'}, {name: 'Police Officer', emoji: '👮'}, {name: 'Firefighter', emoji: '👨‍🚒'}, {name: 'Chef', emoji: '👨‍🍳'} ],
            'transport': [ {name: 'Car', emoji: '🚗'}, {name: 'Bus', emoji: '🚌'}, {name: 'Train', emoji: '🚂'}, {name: 'Airplane', emoji: '✈️'}, {name: 'Boat', emoji: '⛵'} ],
            'family': [ {name: 'Mother', emoji: '👩'}, {name: 'Father', emoji: '👨'}, {name: 'Sister', emoji: '👧'}, {name: 'Brother', emoji: '👦'}, {name: 'Baby', emoji: '👶'} ],
            'seasons': [ {name: 'Spring', emoji: '🌸'}, {name: 'Summer', emoji: '☀️'}, {name: 'Autumn', emoji: '🍂'}, {name: 'Winter', emoji: '❄️'} ],
            'weather': [ {name: 'Sunny', emoji: '☀️'}, {name: 'Cloudy', emoji: '☁️'}, {name: 'Rainy', emoji: '🌧️'}, {name: 'Snowy', emoji: '❄️'}, {name: 'Windy', emoji: '💨'} ],
            'restaurant': [ {name: 'Pizza', emoji: '🍕'}, {name: 'Burger', emoji: '🍔'}, {name: 'Fries', emoji: '🍟'}, {name: 'Ice Cream', emoji: '🍦'} ],
            'kitchen': [ {name: 'Plate', emoji: '🍽️'}, {name: 'Fork', emoji: '🍴'}, {name: 'Spoon', emoji: '🥄'}, {name: 'Cup', emoji: '☕'}, {name: 'Knife', emoji: '🔪'} ],
            'vegetables': [ {name: 'Carrot', emoji: '🥕'}, {name: 'Broccoli', emoji: '🥦'}, {name: 'Tomato', emoji: '🍅'}, {name: 'Corn', emoji: '🌽'} ],
            'fruits': [ {name: 'Apple', emoji: '🍎'}, {name: 'Banana', emoji: '🍌'}, {name: 'Orange', emoji: '🍊'}, {name: 'Grapes', emoji: '🍇'}, {name: 'Strawberry', emoji: '🍓'} ]
        };

        const categoryButtonsConfig = [
            { id: 'alphabet', name: 'Alphabet', style: 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)', icon: '🔤' },
            { id: 'sight-words', name: 'Sight Words', style: 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', icon: '✍️' },
            { id: 'cvc-words', name: 'CVC Words', style: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)', icon: '🅰️' },
            { id: 'prepositions', name: 'Prepositions', style: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', icon: '➡️' },
            { id: 'expressions', name: 'Expressions', style: 'linear-gradient(135deg, #ffedbc 0%, #ed4264 100%)', icon: '😄' },
            { id: 'wild-animals', name: 'Wild Animals', style: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)', icon: '🦁' },
            { id: 'pets', name: 'Pets', style: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', icon: '🐶' },
            { id: 'space', name: 'Space', style: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)', icon: '🚀' },
            { id: 'human-body', name: 'Human Body', style: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)', icon: '👋' },
            { id: 'colors', name: 'Colors', style: 'linear-gradient(135deg, #30cfd0 0%, #330867 100%)', icon: '🎨' },
            { id: 'shapes', name: 'Shapes', style: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)', icon: '⭐️' },
            { id: 'numbers', name: 'Numbers', style: 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', icon: '🔢' },
            { id: 'polygons', name: 'Polygons', style: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', icon: '💠' },
            { id: 'careers', name: 'Careers', style: 'linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%)', icon: '🧑‍🏫' },
            { id: 'transport', name: 'Transport', style: 'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)', icon: '🚗' },
            { id: 'family', name: 'Family', style: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)', icon: '👨‍👩‍👧‍👦' },
            { id: 'seasons', name: 'Seasons', style: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', icon: '🍂' },
            { id: 'weather', name: 'Weather', style: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)', icon: '☀️' },
            { id: 'restaurant', name: 'Restaurant', style: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)', icon: '🍔' },
            { id: 'kitchen', name: 'Kitchen', style: 'linear-gradient(135deg, #30cfd0 0%, #330867 100%)', icon: '🍳' },
            { id: 'vegetables', name: 'Vegetables', style: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)', icon: '🥦' },
            { id: 'fruits', name: 'Fruits', style: 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', icon: '🍓' }
        ];

        let currentCategory = '';
        let currentIndex = 0;
        let currentWord = '';
        const PEXELS_API_KEY = "ILRTk4vCDhwNFMRUWz9or1QAl9uEdRnF8CxWWnheDE2BLRWNGlwn78sW";
        const flashcardImage = document.getElementById('flashcardImage');
        const flashcardName = document.getElementById('flashcardName');
        const counter = document.getElementById('counter');
        const searchInput = document.getElementById('search-input');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const categoriesContainer = document.getElementById('categories-container');

        function generateCategoryButtons() {
            let buttonsHTML = '';
            categoryButtonsConfig.forEach(cat => {
                 buttonsHTML += `<button class="category-btn" style="background: ${cat.style};" onclick="showCategory('${cat.id}')">${cat.icon} ${cat.name}</button>`;
            });
            categoriesContainer.innerHTML = buttonsHTML;
        }

        async function searchPicture() {
            const searchTerm = searchInput.value.trim();
            if (!searchTerm) return;
            flashcardImage.innerHTML = '...';
            flashcardName.textContent = 'Searching';
            currentWord = searchTerm;
            counter.textContent = "Search";
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            const url = `https://api.pexels.com/v1/search?query=${searchTerm}&per_page=1`;
            try {
                const response = await fetch(url, { headers: { Authorization: PEXELS_API_KEY } });
                const data = await response.json();
                if (data.photos && data.photos.length > 0) {
                    flashcardImage.innerHTML = `<img src="${data.photos[0].src.large}" alt="${searchTerm}">`;
                    const capitalized = searchTerm.charAt(0).toUpperCase() + searchTerm.slice(1);
                    flashcardName.textContent = capitalized;
                    currentWord = capitalized;
                    speakCurrentWord();
                } else {
                    flashcardImage.textContent = '😢';
                    flashcardName.textContent = 'Not Found';
                }
            } catch (error) {
                flashcardImage.textContent = '❌';
                flashcardName.textContent = 'Error';
                console.error("Pexels Error:", error);
            }
        }
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchPicture(); });
        
        function showCategory(categoryKey) {
            currentCategory = categoryKey;
            currentIndex = 0;
            prevBtn.style.display = 'block';
            nextBtn.style.display = 'block';
            showCard();
        }
        
        function showCard() {
            const card = decks[currentCategory][currentIndex];
            if (card.emoji) {
                flashcardImage.style.fontSize = "120px";
                flashcardImage.textContent = card.emoji;
            } else {
                flashcardImage.style.fontSize = "6em"; // Font size for letters/words
                flashcardImage.textContent = card.name;
            }
            flashcardName.textContent = card.name;
            currentWord = card.name;
            counter.textContent = `${currentIndex + 1}/${decks[currentCategory].length}`;
            speakCurrentWord(false);
        }

        function nextCard() { 
            currentIndex = (currentIndex + 1) % decks[currentCategory].length; 
            showCard(); 
        }
        function prevCard() { 
            currentIndex = (currentIndex - 1 + decks[currentCategory].length) % decks[currentCategory].length; 
            showCard(); 
        }
        function speakCurrentWord(forceSpeak = true) {
            if (forceSpeak && 'speechSynthesis' in window && currentWord) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(currentWord);
                utterance.rate = 0.8;
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }
        document.addEventListener('keydown', (e) => {
            if (nextBtn.style.display !== 'none' && e.key === 'ArrowRight') nextCard();
            if (prevBtn.style.display !== 'none' && e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ') { e.preventDefault(); speakCurrentWord(); }
        });
        
        generateCategoryButtons();
    </script>
</body>
